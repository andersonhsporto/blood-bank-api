services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    networks:
      - bank-network
    volumes:
      - ${PWD}/db-data/:/var/lib/postgresql/data/
      - ${PWD}/init.sql:/docker-entrypoint-initdb.d/init.sql

networks:
  bank-network:
    driver: bridge